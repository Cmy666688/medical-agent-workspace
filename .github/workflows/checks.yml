name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install streamlit==1.66.1 langchain-core==1.7.3 httpx==0.28.1 pydantic==2.13.4 numpy==2.2.6 pandas==2.3.3 Pillow==11.2.1 opencc-python-reimplemented==0.1.7
      - name: Compile source
        run: python -m compileall -q agents app_pages *.py
      - name: Test account and family isolation
        run: |
          mkdir -p runtime
          python -m unittest test_accounts test_family test_family_extensions test_identity_product test_conversations
      - name: Test API contracts with synthetic responses
        run: python -m unittest test_llm_engineering test_vision_monitor test_project_completion test_risk_results
      - name: Test public deployment isolation and limits
        run: python test_public_deployment.py
      - name: Test medication source matching and UI
        run: python -m unittest test_medication_knowledge
      - name: Test consultation card ownership, versions and UI
        run: python -m unittest test_consultation_card
      - name: Test execution timeline and real progress events
        run: python -m unittest test_execution_timeline
      - name: Test coordinator page and shared conversation persistence
        run: python -m unittest test_coordinator_page
      - name: Test user administration and conversation continuity
        run: python -m unittest test_user_management
      - name: Test shared user migration and household invitations
        run: python -m unittest test_shared_user_store
      - name: Test family membership feedback and navigation
        run: python -m unittest test_family_membership_feedback
